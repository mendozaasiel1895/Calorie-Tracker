<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Calorie Tracker</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700&display=swap"
    />
    <link rel="stylesheet" href="Calorie Tracker.css" />
    <script src="Calorie Tracker.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Calorie Tracker</h1>
      <p class="sub">
        Lose, maintain, or gain weight. Set your plan, log food and exercise,
        and track your weight. Everything stays in this browser.
      </p>
      <nav role="tablist">
        <button role="tab" data-t="plan" aria-selected="true">Plan</button>
        <button role="tab" data-t="today" aria-selected="false">
          Daily log
        </button>
        <button role="tab" data-t="prog" aria-selected="false">Progress</button>
      </nav>

      <section id="plan">
        <form id="pf" class="card" novalidate>
          <h2>Your details</h2>
          <div class="grid">
            <label
              >Goal<select id="gl">
                <option value="lose">Lose weight</option>
                <option value="maintain">Maintain weight</option>
                <option value="gain">Gain weight</option>
              </select></label
            >
            <label
              >Sex<select id="sex">
                <option value="m">Male</option>
                <option value="f">Female</option>
              </select></label
            >
            <label
              >Age (18 to 80)<input
                id="age"
                inputmode="numeric"
                step="1"
                value="31"
            /></label>
            <label
              >Height unit<select id="hu">
                <option value="ftin">ft + in</option>
                <option value="cm">cm</option>
              </select></label
            >
            <label
              >Height<span class="row"
                ><input
                  id="h1"
                  step="any"
                  value="5"
                  aria-label="feet or cm" /><input
                  id="h2"
                  step="any"
                  value="11"
                  aria-label="inches" /></span
            ></label>
            <label
              >Weight unit<select id="wu">
                <option value="kg">kg</option>
                <option value="lb">lb</option>
              </select></label
            >
            <label>Current weight<input id="wt" step="any" value="90" /></label>
            <label>Goal weight<input id="gw" step="any" value="80" /></label>
            <label
              >Duration (1 to 24 months)<input id="mo" step="1" value="6"
            /></label>
            <label>Start date<input id="sd" type="date" /></label>
            <label>Daily activity<select id="act"></select></label>
            <label
              >Eat back exercise calories<select id="eat">
                <option value="0">0% (strict)</option>
                <option value="50" selected>50% (good for losing)</option>
                <option value="100">100% (good for gaining)</option>
              </select></label
            >
          </div>
          <div id="perr" class="err" hidden></div>
          <button class="btn" type="submit">Calculate and save plan</button>
        </form>
        <div id="pres"></div>
      </section>

      <section id="today" hidden></section>
      <section id="prog" hidden></section>
    </main>
  </body>
</html>
